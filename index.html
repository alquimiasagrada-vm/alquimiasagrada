<!DOCTYPE html><!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alquimia Sagrada · Terapias Cósmicas</title>

<!-- GSAP & ScrollTrigger -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<!-- Calculadora de Carta Natal: astronomía, zona horaria histórica y fechas -->
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tz-lookup@6.1.25/tz.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.7.2/build/global/luxon.min.js"></script>

<!-- Tipografías -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Tangerine:wght@400;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-base: #faf3e8;
    --ink: #1c3144;
    --text-main: #223449;
    --text-muted: #5c6d7e;
    --gold: #c9982f;
    --gold-dim: rgba(201, 152, 47, 0.22);
    --teal: #2f7681;
    --teal-dim: rgba(47, 118, 129, 0.2);
    --font-heading: 'Cormorant Garamond', serif;
    --font-script: 'Tangerine', cursive;
    --font-body: 'Manrope', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }
  
  body {
    background-color: var(--bg-base);
    color: var(--text-main);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  /* =========================================
     TEXTURA DE GRANO / RUIDO SUTIL
     ========================================= */
  .grain-overlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0.035;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 160px 160px;
  }

  /* =========================================
     HEADER SUPERIOR - ALQUIMIA SAGRADA
     ========================================= */
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 90;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 14px 20px;
    background: rgba(250, 243, 232, 0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(201, 152, 47, 0.15);
  }

  .brand-title {
    font-family: var(--font-script);
    font-size: clamp(2.2rem, 4vw, 3rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    background: linear-gradient(100deg, var(--ink) 20%, var(--gold) 40%, #fff8e2 50%, var(--gold) 60%, var(--ink) 80%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(201, 152, 47, 0.15);
    position: relative;
    animation: titleShimmer 6s linear infinite;
  }

  @keyframes titleShimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .brand-title::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 1px;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
  }

  /* =========================================
     FONDO CÓSMICO ANIMADO
     ========================================= */
  .cosmic-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 12% 30%, rgba(76, 155, 163, 0.28) 0%, transparent 45%),
      radial-gradient(circle at 88% 28%, rgba(224, 178, 90, 0.28) 0%, transparent 50%),
      var(--bg-base);
    transition: background 1.2s ease;
  }

  .parallax-layer {
    position: fixed;
    inset: -50%;
    z-index: 0;
    pointer-events: none;
    will-change: transform;
  }

  .stars-layer-1 {
    position: absolute; inset: 0; z-index: 0;
    background-image: 
      radial-gradient(1px 1px at 10% 20%, rgba(201,152,47,0.55) 100%, transparent),
      radial-gradient(1px 1px at 80% 40%, rgba(47,118,129,0.45) 100%, transparent),
      radial-gradient(1.5px 1.5px at 30% 70%, rgba(201,152,47,0.5) 100%, transparent);
    background-size: 250px 250px;
    opacity: 0.5;
    animation: starDrift 150s linear infinite;
    pointer-events: none;
  }

  .stars-layer-2 {
    position: absolute; inset: 0; z-index: 0;
    background-image: 
      radial-gradient(2px 2px at 90% 80%, rgba(47,118,129,0.35) 100%, transparent),
      radial-gradient(2px 2px at 50% 10%, rgba(201,152,47,0.5) 100%, transparent),
      radial-gradient(1px 1px at 20% 50%, rgba(201,152,47,0.4) 100%, transparent);
    background-size: 400px 400px;
    opacity: 0.5;
    animation: starDrift 90s linear infinite reverse;
    pointer-events: none;
  }

  @keyframes starDrift {
    0% { transform: rotate(0deg) translateY(0); }
    100% { transform: rotate(360deg) translateY(100px); }
  }

  .twinkle-star {
    position: fixed;
    width: 2px; height: 2px;
    background: var(--teal);
    color: var(--teal);
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    animation: twinkle 4s ease-in-out infinite;
  }
  .twinkle-star.gold { background: var(--gold); color: var(--gold); }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.6); }
    50% { opacity: 1; transform: scale(1.6); box-shadow: 0 0 6px 1px currentColor; }
  }

  .tw-1 { top: 12%; left: 22%; animation-duration: 3.2s; animation-delay: 0.2s; }
  .tw-2 { top: 68%; left: 8%; animation-duration: 4.5s; animation-delay: 1.1s; color: var(--gold); }
  .tw-3 { top: 24%; left: 78%; animation-duration: 3.8s; animation-delay: 2s; }
  .tw-4 { top: 82%; left: 60%; animation-duration: 5s; animation-delay: 0.6s; color: var(--gold); }
  .tw-5 { top: 40%; left: 92%; animation-duration: 3.5s; animation-delay: 1.6s; }
  .tw-6 { top: 55%; left: 35%; animation-duration: 4.2s; animation-delay: 2.6s; color: var(--gold); }
  .tw-7 { top: 6%; left: 55%; animation-duration: 3.9s; animation-delay: 0.9s; }
  .tw-8 { top: 90%; left: 15%; animation-duration: 4.7s; animation-delay: 1.9s; }

  .constellation-svg {
    position: fixed;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0.35;
  }
  .constellation-svg circle { fill: var(--gold); }
  .constellation-svg line {
    stroke: var(--gold);
    stroke-width: 0.6;
    stroke-dasharray: 4 3;
    animation: constellationFade 8s ease-in-out infinite alternate;
  }
  .constellation-svg .const-b line { animation-delay: -3s; }

  @keyframes constellationFade {
    0% { opacity: 0.15; }
    100% { opacity: 0.55; }
  }

  .shooting-star {
    position: fixed; z-index: 0;
    width: 2px; height: 80px;
    background: linear-gradient(to bottom, rgba(201,152,47,0.85), transparent);
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
  }
  .ss-1 { top: -10%; left: 30%; animation: shoot 8s linear infinite 2s; }
  .ss-2 { top: -10%; right: 20%; animation: shoot 12s linear infinite 7s; }
  .ss-3 { top: 20%; right: -10%; animation: shoot 15s linear infinite 4s; }

  @keyframes shoot {
    0% { transform: translate(0, 0) rotate(45deg) scale(0); opacity: 0; }
    5% { transform: translate(-50px, 50px) rotate(45deg) scale(1.5); opacity: 1; }
    15% { transform: translate(-300px, 300px) rotate(45deg) scale(0); opacity: 0; }
    100% { opacity: 0; }
  }

  .cross-flare {
    position: fixed;
    width: 2px; height: 2px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 10px 2px rgba(201,152,47,0.5);
    animation: pulseFlare 5s infinite alternate ease-in-out;
    pointer-events: none;
    z-index: 1;
  }
  .cross-flare::before, .cross-flare::after {
    content: ''; position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: linear-gradient(90deg, transparent, rgba(201,152,47,0.6), transparent);
  }
  .cross-flare::before { width: 40px; height: 1px; }
  .cross-flare::after { width: 1px; height: 40px; }
  
  .cf-1 { top: 20%; left: 12%; animation-duration: 4s; }
  .cf-2 { top: 75%; left: 45%; animation-delay: -2s; animation-duration: 6s; }
  .cf-3 { top: 30%; right: 18%; animation-delay: -1s; }
  .cf-4 { top: 85%; right: 35%; animation-delay: -3s; animation-duration: 7s; }
  .cf-5 { top: 10%; right: 45%; animation-delay: -4s; }

  @keyframes pulseFlare {
    0% { transform: scale(0.6) rotate(-15deg); opacity: 0.3; }
    100% { transform: scale(1.2) rotate(15deg); opacity: 1; filter: drop-shadow(0 0 12px var(--gold)); }
  }

  .zodiac-bg {
    position: fixed; font-family: serif; color: rgba(28, 49, 68, 0.04);
    font-size: 7rem; pointer-events: none; z-index: 0;
    animation: floatZodiac 20s ease-in-out infinite alternate;
  }
  .z-1 { top: 15%; left: 5%; }
  .z-2 { top: 65%; left: 8%; animation-delay: -5s; animation-duration: 25s; }
  .z-3 { top: 20%; right: 8%; animation-delay: -10s; }
  .z-4 { top: 80%; right: 12%; animation-delay: -15s; animation-duration: 22s; }

  @keyframes floatZodiac {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(30px, -20px) rotate(10deg); }
  }

  .hero-block {
    min-height: 90vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .hero-block .item-photo { display: none; }

  .music-player {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 250, 240, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid var(--gold-dim);
    padding: 10px 18px;
    border-radius: 50px;
    box-shadow: 0 10px 30px rgba(28, 49, 68, 0.12);
    transition: border-color 0.6s ease, box-shadow 0.6s ease;
  }

  .play-btn {
    background: var(--gold);
    color: #fff8ea;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.4s ease, box-shadow 0.4s ease;
    box-shadow: 0 0 15px rgba(201, 152, 47, 0.35);
    flex-shrink: 0;
  }

  .play-btn:hover {
    transform: scale(1.08);
  }

  .play-icon {
    font-size: 0.85rem;
    margin-left: 2px;
  }

  .music-info {
    display: flex;
    flex-direction: column;
    max-width: 180px;
  }

  .music-title {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .music-subtitle {
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .eq-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
    margin-left: 4px;
  }
  .eq-bar {
    width: 2px;
    background: var(--gold);
    height: 3px;
    transition: height 0.2s ease, background 0.4s ease;
  }
  .playing .eq-bar:nth-child(1) { animation: bounceEq 0.6s infinite alternate; }
  .playing .eq-bar:nth-child(2) { animation: bounceEq 0.4s infinite alternate; animation-delay: 0.1s; }
  .playing .eq-bar:nth-child(3) { animation: bounceEq 0.5s infinite alternate; animation-delay: 0.2s; }

  @keyframes bounceEq {
    0% { height: 3px; }
    100% { height: 12px; }
  }

  .scroll-container {
    display: flex;
    position: relative;
    z-index: 10;
    max-width: 1400px;
    margin: 0 auto;
    padding: 2vh 4vw 0;
  }

  .text-col {
    width: 50%;
    padding: 10vh 5vw 10vh 0;
  }

  .therapy-item {
    min-height: 80vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    opacity: 0.2;
    transition: opacity 0.6s ease;
  }
  .therapy-item.active { opacity: 1; }

  .item-photo { display: none; }

  .therapy-item h2,
  .therapy-item p,
  .therapy-item .btn,
  .therapy-item .item-photo {
    opacity: 0;
    transform: translateY(26px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .therapy-item.in-view h2 { opacity: 1; transform: translateY(0); }
  .therapy-item.in-view p { opacity: 1; transform: translateY(0); transition-delay: 0.12s; }
  .therapy-item.in-view .item-photo { opacity: 1; transform: translateY(0); }
  .therapy-item.in-view .btn { opacity: 1; transform: translateY(0); transition-delay: 0.55s; }

  .therapy-item h2 {
    font-family: var(--font-heading);
    font-size: clamp(3rem, 4.5vw, 4rem);
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 1.5rem;
    color: var(--ink);
    text-shadow: 0 2px 10px rgba(28, 49, 68, 0.08);
  }

  .therapy-item p {
    font-size: 1.15rem;
    line-height: 1.7;
    color: var(--text-muted);
    max-width: 500px;
    margin-bottom: 1.5rem;
  }

  .therapy-benefits {
    list-style: none;
    margin-bottom: 2rem;
    max-width: 500px;
  }
  .therapy-benefits li {
    position: relative;
    padding-left: 1.5rem;
    margin-bottom: 0.75rem;
    color: var(--text-muted);
    font-size: 1.05rem;
    line-height: 1.5;
    opacity: 0;
    transform: translateX(-16px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .therapy-item.in-view .therapy-benefits li { opacity: 1; transform: translateX(0); }
  .therapy-item.in-view .therapy-benefits li:nth-child(1) { transition-delay: 0.22s; }
  .therapy-item.in-view .therapy-benefits li:nth-child(2) { transition-delay: 0.36s; }
  .therapy-item.in-view .therapy-benefits li:nth-child(3) { transition-delay: 0.5s; }

  .therapy-benefits li::before {
    content: '✦';
    position: absolute;
    left: 0;
    color: var(--gold);
    font-size: 0.9rem;
    top: 2px;
  }

  .btn {
    display: inline-block;
    position: relative;
    padding: 1rem 2.5rem;
    border-radius: 50px;
    background: var(--gold);
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
    letter-spacing: 1px;
    font-size: 0.9rem;
    width: fit-content;
    box-shadow: 0 4px 20px rgba(201, 152, 47, 0.35);
    transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.4s ease;
  }
  .btn:hover {
    transform: translateY(-3px);
  }

  .visual-col {
    width: 50%;
    height: 100vh;
    position: sticky;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .portal-frame {
    position: relative;
    width: min(42vw, 550px);
    aspect-ratio: 1/1;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
    box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 30px var(--gold-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: portalBreathe 5.5s ease-in-out infinite;
  }

  @keyframes portalBreathe {
    0%, 100% {
      box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 30px var(--gold-dim);
      border-color: var(--gold-dim);
    }
    50% {
      box-shadow: 0 0 75px rgba(0,0,0,0.8), inset 0 0 45px rgba(201, 152, 47, 0.35), 0 0 30px rgba(201, 152, 47, 0.2);
      border-color: rgba(201, 152, 47, 0.45);
    }
  }

  .nav-sobre-mi-btn {
    position: absolute;
    left: 25px;
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 500;
    text-decoration: none;
    color: var(--text-main);
    padding: 6px 16px;
    border-radius: 50px;
    border: 1px solid var(--gold-dim);
    background: rgba(255, 250, 240, 0.6);
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
  }
  .nav-sobre-mi-btn:hover {
    color: var(--gold);
    border-color: var(--gold);
    transform: translateY(-1px);
    box-shadow: 0 0 10px rgba(201, 152, 47, 0.2);
  }
</style>
</head>
<body>

  <!-- HEADER FIJO CON EL NOMBRE DEL EMPRENDIMIENTO -->
  <header class="site-header">
    <a href="sobre-mi.html" class="nav-sobre-mi-btn">Sobre Mí</a>
    <h1 class="brand-title">Alquimia Sagrada</h1>
  </header>

  <div class="cosmic-bg" id="main-bg"></div>

  <div class="parallax-layer" id="parallax-1"><div class="stars-layer-1"></div></div>
  <div class="parallax-layer" id="parallax-2"><div class="stars-layer-2"></div></div>

  <!-- REPRODUCTOR FLOTANTE -->
  <div class="music-player" id="musicPlayerContainer">
    <button class="play-btn" id="playBtn" onclick="togglePlay()">
      <span class="play-icon" id="playIcon">▶</span>
    </button>
    <div class="music-info">
      <span class="music-title">Frecuencia Cósmica 432Hz</span>
      <span class="music-subtitle">Música de Meditación</span>
    </div>
    <div class="eq-bars" id="eqBars">
      <div class="eq-bar dynamic-eq"></div>
      <div class="eq-bar dynamic-eq"></div>
      <div class="eq-bar dynamic-eq"></div>
    </div>
  </div>

  <audio id="bg-audio" loop preload="auto">
    <source src="meditacion.mp3" type="audio/mpeg">
  </audio>

  <main class="scroll-container">
    <div class="text-col">
      <div class="hero-block">
        <h2 style="font-family: var(--font-heading); font-size: 2.5rem; color: var(--ink);">Bienvenido al Portal</h2>
        <p>Explora el espacio cósmico y las terapias sagradas diseñadas para tu evolución espiritual.</p>
      </div>
    </div>
  </main>

</body>
</html>
