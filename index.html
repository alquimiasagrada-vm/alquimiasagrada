<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alquimia Sagrada - Carta Natal</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1a1a24;
            --accent-color: #d4af37;
            --accent-hover: #f3c643;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --error-color: #f87171;
            --success-color: #4ade80;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 2rem;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-top: 0;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .natal-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .natal-field {
            display: flex;
            flex-direction: column;
        }

        .natal-field-wide {
            grid-column: span 2;
        }

        label {
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
        }

        input {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 6px;
            padding: 0.75rem 1rem;
            color: var(--text-color);
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn {
            grid-column: span 2;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 6px;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .natal-status {
            grid-column: span 2;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            min-height: 20px;
        }

        .natal-status.error {
            color: var(--error-color);
        }

        .natal-status.success {
            color: var(--success-color);
        }

        .natal-result {
            margin-top: 2rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            border: 1px solid rgba(212, 175, 55, 0.1);
            display: none; /* Se muestra al recibir datos */
            line-height: 1.6;
        }

        .natal-result h3 {
            color: var(--accent-color);
            margin-top: 0;
        }

        @media (max-width: 600px) {
            .natal-form {
                grid-template-columns: 1fr;
            }
            .natal-field-wide, .btn, .natal-status {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>Alquimia Sagrada</h1>
            <div class="subtitle">Descubre los arquetipos y mensajes de tu carta natal a través de la inteligencia estelar.</div>
            
            <form class="natal-form" id="natalForm">
                <div class="natal-field natal-field-wide">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </div>
                
                <div class="natal-field">
                    <label for="fecha">Fecha de Nacimiento</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>
                
                <div class="natal-field">
                    <label for="hora">Hora de Nacimiento</label>
                    <input type="time" id="hora" name="hora" required>
                </div>
                
                <div class="natal-field natal-field-wide">
                    <label for="lugar">Lugar de Nacimiento (Ciudad, País)</label>
                    <input type="text" id="lugar" name="lugar" placeholder="Ej: Córdoba, Argentina" required>
                </div>
                
                <button type="submit" class="btn natal-submit">Interpretar mi Carta</button>
                <div class="natal-status" id="natalStatus"></div>
            </form>

            <div id="interpretacionGemini" class="natal-result"></div>
        </div>
    </div>

    <script>
        const natalForm = document.getElementById('natalForm');
        const statusDiv = document.getElementById('natalStatus');
        const resultDiv = document.getElementById('interpretacionGemini');

        if (natalForm) {
            natalForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const nombre = document.getElementById('nombre').value.trim();
                const fecha = document.getElementById('fecha').value;
                const hora = document.getElementById('hora').value;
                const lugar = document.getElementById('lugar').value.trim();

                if (!fecha || !hora || !lugar) {
                    statusDiv.textContent = 'Por favor, completa todos los campos requeridos.';
                    statusDiv.className = 'natal-status error';
                    return;
                }

                statusDiv.textContent = '✦ Canalizando los astros e interpretando tu carta... ✦';
                statusDiv.className = 'natal-status';
                resultDiv.style.display = 'none';

                try {
                    const response = await fetch('/api/interpretar-carta', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ nombre, fecha, hora, lugar }),
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Error al procesar la interpretación');
                    }

                    statusDiv.textContent = '¡Interpretación canalizada con éxito!';
                    statusDiv.className = 'natal-status success';

                    // Mostramos el resultado dentro del contenedor estilizado
                    resultDiv.innerHTML = `<h3>Lectura para ${nombre || 'Viajero/a'}</h3>` + (data.interpretacion || data.resultado || 'Sin contenido generado.');
                    resultDiv.style.display = 'block';

                } catch (error) {
                    console.error('Error al conectar con la API:', error);
                    statusDiv.textContent = 'Ocurrió un error cósmico al conectar con la API. Inténtalo de nuevo.';
                    statusDiv.className = 'natal-status error';
                }
            });
        }
    </script>
</body>
</html>
